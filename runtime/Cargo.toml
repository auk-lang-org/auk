[package]
name = "auk_rt"
version = "0.1.0"
edition = "2024"
description = "The Auk runtime (linked into JIT-compiled programs and into `auk build` executables)"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
