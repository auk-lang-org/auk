[package]
name = "llvm"
version = "0.1.0"
effects = ["ffi"]

# LLVM 23's shared library, from `llvm-config --libdir` (`LLVM_CONFIG` names another
# llvm-config): Homebrew's llvm@23 on macOS (keg-only, so its llvm-config isn't on the PATH);
# apt.llvm.org's llvm-23-dev on Linux
[link]
macos = ["$(${LLVM_CONFIG:-/opt/homebrew/opt/llvm@23/bin/llvm-config} --libdir)/libLLVM.dylib"]
linux = ["$(${LLVM_CONFIG:-llvm-config-23} --libdir)/libLLVM.so"]
