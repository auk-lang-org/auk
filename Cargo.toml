[package]
name = "duck"
version = "0.1.0"
edition = "2024"

[dependencies]
duck_rt = { path = "runtime" }
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-object = "0.137.1"
cranelift-native = "0.137.1"
libc = "0.2"
# The LLVM back end (C API; LLVM 23, linked dynamically: see .cargo/config.toml)
llvm-sys = { version = "231", features = ["prefer-dynamic"] }
# DWARF for `duck build -g` (the versions cranelift-object uses)
gimli = { version = "0.33", default-features = false, features = ["write", "std"] }
object = { version = "0.40", default-features = false, features = ["write", "read_core", "std", "elf", "macho"] }

[workspace]
members = [".", "runtime"]

# The runtime staticlib (built by build.rs for linking generated programs) never unwinds.
[profile.rt]
inherits = "release"
panic = "abort"
