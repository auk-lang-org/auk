name: LLVM 23
description: Install LLVM 23 (clang, llvm-config, libLLVM) and what the tests use; sets LLVM_CONFIG.
runs:
  using: composite
  steps:
    - name: macOS (Homebrew llvm@23)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # llvm@23 where Homebrew has the versioned formula, else llvm (when it is 23)
        if brew info llvm@23 > /dev/null 2>&1; then f=llvm@23; else f=llvm; fi
        brew install "$f" openssl@3 sqlite
        cfg="$(brew --prefix "$f")/bin/llvm-config"
        v="$("$cfg" --version)"
        case "$v" in 23.*) ;; *) echo "::error::Homebrew's $f is LLVM $v, not 23"; exit 1 ;; esac
        echo "LLVM_CONFIG=$cfg" >> "$GITHUB_ENV"
        # lldb may launch and debug processes (the native debug info test runs a program in it)
        sudo DevToolsSecurity -enable || true
    - name: Linux (apt.llvm.org)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        sudo bash /tmp/llvm.sh 23
        sudo apt-get install -y --no-install-recommends llvm-23-dev libclang-rt-23-dev lldb-23 \
          libssl-dev openssl libsqlite3-dev zlib1g-dev libzstd-dev libxml2-dev libffi-dev
        echo "LLVM_CONFIG=llvm-config-23" >> "$GITHUB_ENV"
        echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
